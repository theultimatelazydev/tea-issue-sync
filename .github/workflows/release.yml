name: release
on:
  push:
    tags: ['v*']

# Builds native binaries when a tag arrives. Since the Gitea repo mirrors to
# GitHub, a tag pushed on Gitea lands here and produces the GitHub release
# assets that push-mirroring alone does NOT carry over.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: make dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tea-issue-sync-*
          generate_release_notes: true
