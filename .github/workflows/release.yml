name: release
on:
  push:
    tags: ['v*']

# Builds native binaries when a tag arrives. Since the Gitea repo mirrors to
# GitHub, a tag pushed on Gitea lands here and produces the GitHub release
# assets that push-mirroring alone does NOT carry over.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: make dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md
          fi
          echo "--- release notes ---"; cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tea-issue-sync-*
          body_path: release-notes.md
